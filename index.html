<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="Sua aplicação PWA para acompanhamento de rotinas e hábitos diários.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Habit Flow - PWA</title>

  <!-- PWA Manifest Embutido via Data URI -->
  <link rel="manifest" id="manifest-placeholder">

  <!-- Ícones SVG / Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%234f46e5'/><path d='M30 50 L45 65 L70 35' stroke='white' stroke-width='10' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%234f46e5'/><path d='M30 50 L45 65 L70 35' stroke='white' stroke-width='10' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>">

  <style>
    :root {
      --primary: #4f46e5;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      max-width: 480px;
      margin: 0 auto;
      transition: background-color 0.3s, color 0.3s;
    }

    header {
      padding: 1rem;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-icon {
      background: none;
      border: none;
      font-size: 1.25rem;
      cursor: pointer;
      padding: 0.5rem;
      border-radius: 50%;
      color: var(--text);
    }

    main {
      flex: 1;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .install-banner {
      display: none;
      background: var(--primary);
      color: white;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      justify-content: space-between;
      align-items: center;
    }

    .install-banner button {
      background: white;
      color: var(--primary);
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }

    .add-form {
      display: flex;
      gap: 0.5rem;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    .habit-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .habit-card {
      background: var(--card-bg);
      padding: 1rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .habit-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      cursor: pointer;
    }

    .habit-info.completed span {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .checkbox {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .completed .checkbox {
      background: var(--success);
      border-color: var(--success);
      color: white;
    }

    .delete-btn {
      color: var(--text-muted);
      border: none;
      background: none;
      cursor: pointer;
    }

    .stats {
      background: var(--card-bg);
      padding: 1rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">⚡ HabitFlow</div>
    <button class="btn-icon" id="theme-toggle" title="Alternar Tema">🌙</button>
  </header>

  <main>
    <div id="install-banner" class="install-banner">
      <span>Instalar aplicativo?</span>
      <button id="install-btn">Instalar</button>
    </div>

    <form class="add-form" id="habit-form">
      <input type="text" id="habit-input" placeholder="Novo hábito..." required>
      <button type="submit" class="btn-primary">Adicionar</button>
    </form>

    <div class="stats" id="stats">0 de 0 hábitos concluídos hoje</div>

    <div class="habit-list" id="habit-list"></div>
  </main>

  <script>
    // Configuração do Manifest PWA embutido
    const manifest = {
      name: "Habit Flow PWA",
      short_name: "HabitFlow",
      start_url: "./",
      display: "standalone",
      background_color: "#0f172a",
      theme_color: "#4f46e5",
      icons: [{
        src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%234f46e5'/><path d='M30 50 L45 65 L70 35' stroke='white' stroke-width='10' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>",
        sizes: "192x192 512x512",
        type: "image/svg+xml",
        purpose: "any maskable"
      }]
    };
    const blobManifest = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
    document.getElementById('manifest-placeholder').setAttribute('href', URL.createObjectURL(blobManifest));

    // Service Worker para funcionamento offline
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'habit-flow-v1';
        self.addEventListener('install', (e) => {
          e.waitUntil(caches.open(CACHE_NAME).then(cache => cache.add('./')));
        });
        self.addEventListener('fetch', (e) => {
          e.respondWith(caches.match(e.request).then(res => res || fetch(e.request)));
        });
      `;
      const blobSW = new Blob([swCode], {type: 'text/javascript'});
      navigator.serviceWorker.register(URL.createObjectURL(blobSW)).catch(() => {});
    }

    // Lógica principal
    let habits = JSON.parse(localStorage.getItem('habits')) || [];

    const habitForm = document.getElementById('habit-form');
    const habitInput = document.getElementById('habit-input');
    const habitList = document.getElementById('habit-list');
    const stats = document.getElementById('stats');
    const themeToggle = document.getElementById('theme-toggle');

    themeToggle.addEventListener('click', () => {
      const isDark = document.body.getAttribute('data-theme') === 'dark';
      document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      themeToggle.textContent = isDark ? '🌙' : '☀️';
    });

    function saveAndRender() {
      localStorage.setItem('habits', JSON.stringify(habits));
      render();
    }

    function render() {
      habitList.innerHTML = '';
      let completedCount = 0;

      habits.forEach((habit, index) => {
        if (habit.completed) completedCount++;

        const card = document.createElement('div');
        card.className = 'habit-card';
        card.innerHTML = `
          <div class="habit-info ${habit.completed ? 'completed' : ''}" onclick="toggleHabit(${index})">
            <div class="checkbox">${habit.completed ? '✓' : ''}</div>
            <span>${habit.title}</span>
          </div>
          <button class="delete-btn" onclick="deleteHabit(${index})">🗑️</button>
        `;
        habitList.appendChild(card);
      });

      stats.textContent = `${completedCount} de ${habits.length} hábitos concluídos hoje`;
    }

    habitForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const title = habitInput.value.trim();
      if (title) {
        habits.push({ title, completed: false });
        habitInput.value = '';
        saveAndRender();
      }
    });

    window.toggleHabit = (index) => {
      habits[index].completed = !habits[index].completed;
      saveAndRender();
    };

    window.deleteHabit = (index) => {
      habits.splice(index, 1);
      saveAndRender();
    };

    // Prompt de Instalação PWA
    let deferredPrompt;
    const installBanner = document.getElementById('install-banner');
    const installBtn = document.getElementById('install-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBanner.style.display = 'flex';
    });

    installBtn.addEventListener('click', () => {
      installBanner.style.display = 'none';
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt = null;
      }
    });

    render();
  </script>
</body>
</html>
